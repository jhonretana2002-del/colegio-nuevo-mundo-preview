<button type="button" id="matricula-chat-launcher" class="matricula-chat-launcher" aria-haspopup="dialog" aria-controls="matricula-chat" aria-expanded="false" aria-label="{{lumi.launcherAria}}" hidden><span class="lumi-sign" aria-hidden="true">{{lumi.launcherSign}}</span><span class="lumi-mascot" aria-hidden="true"><span class="lumi-frame"></span><span class="lumi-art lumi-body"></span><span class="lumi-art lumi-hand"></span></span><span class="lumi-name" aria-hidden="true">{{lumi.launcherName}}</span></button>
<button id="lumi-size-toggle" class="lumi-size-toggle" type="button" aria-controls="matricula-chat-launcher" aria-expanded="true" aria-label="{{lumi.minimizeAria}}" hidden><span aria-hidden="true">−</span></button>
<dialog id="matricula-chat" class="matricula-chat" aria-labelledby="matricula-chat-title" aria-describedby="matricula-chat-demo">
 <div class="matricula-chat-header"><span class="matricula-chat-mark" aria-hidden="true"><span class="lumi-mascot lumi-mini"><span class="lumi-frame"></span><span class="lumi-art lumi-body"></span><span class="lumi-art lumi-hand"></span></span></span><div><h2 id="matricula-chat-title">{{lumi.chatTitle}}</h2><p>{{lumi.schoolName}}</p></div><button type="button" id="matricula-chat-close" class="matricula-chat-close" aria-label="{{lumi.closeAria}}"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
 <div class="matricula-chat-body">
  <section id="matricula-chat-home" class="matricula-chat-home" aria-label="{{lumi.homeAria}}"><p class="matricula-chat-kicker">{{lumi.kicker}}</p><h3>{{lumi.heading1}}<br>{{lumi.heading2}}</h3><p class="matricula-chat-welcome">{{lumi.welcome}}</p><p class="matricula-chat-question-label">{{lumi.questionsHeading}}</p><div id="matricula-chat-questions" class="matricula-chat-questions"></div><button type="button" class="matricula-chat-advisor" data-matricula-advisor><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M6 20v-2a6 6 0 0 1 12 0v2M4 11V8a8 8 0 0 1 16 0v3M4 10H2v5h3v-5Zm16 0h2v5h-3v-5Z"/></svg><span><strong>{{lumi.advisorButton}}</strong><small>{{lumi.advisorSubtext}}</small></span><span aria-hidden="true">↗</span></button></section>
  <section id="matricula-chat-conversation" class="matricula-chat-conversation" aria-label="{{lumi.conversationAria}}" hidden><div class="matricula-chat-conversation-top"><button type="button" id="matricula-chat-back" class="matricula-chat-back">← {{lumi.questionsHeading}}</button><button type="button" class="matricula-chat-human" data-matricula-advisor>{{lumi.advisorButton}}</button></div><div id="matricula-chat-log" class="matricula-chat-log" role="log" aria-label="{{lumi.logAria}}" aria-live="polite" aria-relevant="additions"></div><p id="matricula-chat-advisor-notice" class="matricula-chat-advisor-notice" hidden><strong>{{lumi.advisorNoticeTitle}}</strong><br>{{lumi.advisorNoticeText}}</p><form id="matricula-chat-form" class="matricula-chat-form"><label for="matricula-chat-input" class="matricula-chat-label">{{lumi.inputLabel}}</label><textarea id="matricula-chat-input" rows="2" maxlength="300" placeholder="{{lumi.inputPlaceholder}}" autocomplete="off" spellcheck="true" required></textarea><button type="submit" id="matricula-chat-send" class="matricula-chat-send" aria-label="{{lumi.sendAria}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m3 3 19 9-19 9 4-9-4-9Zm4 9h15"/></svg></button></form></section>
 </div><div class="matricula-chat-footer"><span id="matricula-chat-demo">{{lumi.demoNote}}</span><a href="{{BASE}}contacto/" data-matricula-contact>{{lumi.contactLink}}</a></div>
</dialog>
